version: '3'
silent: true

vars:
  DEVBOX_PORTS: sh script/devbox-ports

tasks:
  default:
    desc: 利用可能なタスクを表示
    cmds:
      - task --list

  all:
    desc: 利用可能なタスクを表示
    cmds:
      - task help

  help:
    desc: 利用可能なタスクを表示
    cmds:
      - task --list

  setup:
    desc: devbox環境を初期化
    cmds:
      - devbox run setup

  setup-git-hooks:
    desc: Git hooksを設定
    cmds:
      - git config --local core.hooksPath .githooks

  shell:
    desc: devbox shellに入る
    cmds:
      - devbox shell

  versions:
    desc: 開発環境のツールバージョンを表示
    cmds:
      - |
        devbox run -- bash -c 'echo "Ruby: $(ruby --version)"; echo "Rails: $(bin/rails --version 2>/dev/null || echo N/A)"; echo "Node: $(node --version)"; echo "Yarn: $(yarn --version)"; echo "PostgreSQL: $(psql --version)"; echo "Bundler: $(bundler --version 2>/dev/null)"' 2>&1 | grep -v '東方カラオケ' | grep -v 'warning:' | grep -v '/nix/store' | grep -v '^Info:' | grep -v '^$' | sed -e 's/ruby //' -e 's/Rails //' -e 's/psql (PostgreSQL) //' -e 's/Bundler version //' -e 's/ (.*//'

  up:
    desc: PostgreSQLとRailsサーバーをバックグラウンド起動（ポート競合時は自動切替）
    cmds:
      - |
        set -eu
        eval "$({{.DEVBOX_PORTS}} select)"
        if [ "$DEVBOX_PORTS_EXISTING" = "1" ]; then
          echo "サービスは既に起動しています (http://localhost:${RAILS_PORT}/admin)"
        else
          pid_file=".devbox/virtenv/postgresql_18/data/postmaster.pid"
          if [ -f "$pid_file" ]; then
            pid=$(head -1 "$pid_file")
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "古いpostmaster.pidを検出しました。削除します..."
              rm -f "$pid_file"
            fi
          fi
          if ! devbox services up \
            --env "PORT=$RAILS_PORT" \
            --env "DEVBOX_PC_PORT_NUM=$DEVBOX_PC_PORT_NUM" \
            -b --pcport "$DEVBOX_PC_PORT_NUM"; then
            {{.DEVBOX_PORTS}} clear
            exit 1
          fi
          echo "サービスを起動しました (http://localhost:${RAILS_PORT}/admin)"
        fi
      - task: versions
      - task: status

  tui:
    desc: PostgreSQLとRailsサーバーをTUIモードで起動
    cmds:
      - |
        set -eu
        eval "$({{.DEVBOX_PORTS}} select)"
        devbox services up \
          --env "PORT=$RAILS_PORT" \
          --env "DEVBOX_PC_PORT_NUM=$DEVBOX_PC_PORT_NUM" \
          --pcport "$DEVBOX_PC_PORT_NUM"

  logs:
    desc: Railsのdevelopment.logを表示
    cmds:
      - tail -f log/development.log

  down:
    desc: devboxサービスを停止
    cmds:
      - |
        set -eu
        eval "$({{.DEVBOX_PORTS}} read)"
        devbox_pc_url="http://localhost:${DEVBOX_PC_PORT_NUM}"
        if curl -fsS "http://127.0.0.1:${RAILS_PORT}/up" >/dev/null 2>&1 || devbox run -- pg_isready -h /tmp -p 5432 >/dev/null 2>&1 || lsof -tiTCP:"$DEVBOX_PC_PORT_NUM" -sTCP:LISTEN >/dev/null 2>&1; then
          curl -fsS -X POST "$devbox_pc_url/project/stop" >/dev/null 2>&1 || devbox services stop --env "DEVBOX_PC_PORT_NUM=$DEVBOX_PC_PORT_NUM" 2>/dev/null || true
          {{.DEVBOX_PORTS}} clear
          echo "サービス停止を要求しました"
        else
          echo "サービスは起動していません"
        fi

  status:
    desc: devboxサービスの状態を表示
    cmds:
      - |
        eval "$({{.DEVBOX_PORTS}} read)"
        if curl -fsS "http://127.0.0.1:${RAILS_PORT}/up" >/dev/null 2>&1; then
          echo "Rails:      Ready (http://localhost:${RAILS_PORT}/up)"
        else
          echo "Rails:      Not running (expected http://localhost:${RAILS_PORT}/up)"
        fi
        if devbox run -- pg_isready -h /tmp -p 5432 >/dev/null 2>&1; then
          echo "PostgreSQL: Ready (/tmp:5432)"
        else
          echo "PostgreSQL: Not running"
        fi

  ps:
    desc: statusのエイリアス
    cmds:
      - task status

  restart:
    desc: devboxサービスを再起動
    cmds:
      - task recover

  fix-pg:
    desc: 古いPIDを削除してPostgreSQLを再起動
    cmds:
      - |
        set -eu
        eval "$({{.DEVBOX_PORTS}} read)"
        devbox_pc_url="http://localhost:${DEVBOX_PC_PORT_NUM}"
        echo "PostgreSQLを修復します..."
        curl -fsS -X POST "$devbox_pc_url/project/stop" >/dev/null 2>&1 || devbox services stop --env "DEVBOX_PC_PORT_NUM=$DEVBOX_PC_PORT_NUM" 2>/dev/null || true
        {{.DEVBOX_PORTS}} clear
        rm -f .devbox/virtenv/postgresql_18/data/postmaster.pid
        echo "postmaster.pidを削除しました。再起動します..."
        eval "$({{.DEVBOX_PORTS}} select)"
        devbox services up \
          --env "PORT=$RAILS_PORT" \
          --env "DEVBOX_PC_PORT_NUM=$DEVBOX_PC_PORT_NUM" \
          -b --pcport "$DEVBOX_PC_PORT_NUM"
        echo "サービスを起動しました (http://localhost:${RAILS_PORT}/admin)"
      - task: status

  health:
    desc: RailsとPostgreSQLの状態を確認
    cmds:
      - echo "=== devbox services ==="
      - task: status
      - |
        eval "$({{.DEVBOX_PORTS}} read)"
        echo ""
        echo "=== listening ports ==="
        lsof -iTCP -sTCP:LISTEN -P 2>/dev/null | grep -E ":(${RAILS_PORT}|${DEVBOX_PC_PORT_NUM}|5432)" || true
        if ! curl -fsS "http://127.0.0.1:${RAILS_PORT}/up" >/dev/null 2>&1; then
          if (lsof -tiTCP:"$RAILS_PORT" -sTCP:LISTEN >/dev/null 2>&1 || lsof -tiTCP:5432 -sTCP:LISTEN >/dev/null 2>&1); then
            echo ""
            echo "WARNING: 想定ポートが使用中ですが、サービスがReadyではありません。task recover で再起動できます。"
          fi
        fi
      - |
        eval "$({{.DEVBOX_PORTS}} read)"
        echo ""
        echo "=== HTTP health ==="
        curl -s -o /dev/null -w '  /up    status=%{http_code} time=%{time_total}s\n' "http://127.0.0.1:${RAILS_PORT}/up" || true
        curl -s -o /dev/null -w '  /admin status=%{http_code} time=%{time_total}s\n' "http://127.0.0.1:${RAILS_PORT}/admin" || true

  doctor:
    desc: healthのエイリアス
    cmds:
      - task health

  recover:
    desc: devboxサービスを停止して再起動
    cmds:
      - task: down
      - task: up
      - |
        set -eu
        eval "$({{.DEVBOX_PORTS}} read)"
        echo "Railsの /up を待機します"
        ready=0
        for i in $(seq 1 30); do
          if curl -fsS "http://127.0.0.1:${RAILS_PORT}/up" >/dev/null 2>&1; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -eq 1 ]; then
          echo "Rails is ready (http://localhost:${RAILS_PORT})"
          task health
        else
          echo "Rails did not become ready within 30 seconds"
          task health
          exit 1
        fi

  recover-force:
    desc: Rails/PostgreSQL/Process Composeの孤児プロセスを停止して再起動
    cmds:
      - |
        set -eu
        echo "孤児プロセスを強制停止します"
        task kill-orphan-ports
      - task: down
      - task: up
      - |
        set -eu
        eval "$({{.DEVBOX_PORTS}} read)"
        echo "Railsの /up を待機します"
        ready=0
        for i in $(seq 1 30); do
          if curl -fsS "http://127.0.0.1:${RAILS_PORT}/up" >/dev/null 2>&1; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -eq 1 ]; then
          echo "Rails is ready (http://localhost:${RAILS_PORT})"
          task health
        else
          echo "Rails did not become ready within 30 seconds"
          task health
          exit 1
        fi

  kill-orphan-ports:
    desc: Rails/PostgreSQL/Process Composeのポートで待ち受ける孤児プロセスを停止
    cmds:
      - |
        eval "$({{.DEVBOX_PORTS}} read)"
        pids="$(
          for port in 3000 "$RAILS_PORT" 5432 "$DEVBOX_PC_PORT_NUM"; do
            lsof -tiTCP:"$port" -sTCP:LISTEN 2>/dev/null || true
          done | sort -u
        )"
        if [ -n "$pids" ]; then
          echo "孤児プロセスを停止します: $pids"
          kill $pids 2>/dev/null || true
          sleep 2
        fi
        pids="$(
          for port in 3000 "$RAILS_PORT" 5432 "$DEVBOX_PC_PORT_NUM"; do
            lsof -tiTCP:"$port" -sTCP:LISTEN 2>/dev/null || true
          done | sort -u
        )"
        if [ -n "$pids" ]; then
          echo "通常終了しない孤児プロセスを強制停止します: $pids"
          kill -9 $pids 2>/dev/null || true
          sleep 1
        fi

  server:
    desc: Railsサーバーを起動（ポート競合時は自動切替）
    cmds:
      - |
        set -eu
        eval "$({{.DEVBOX_PORTS}} new)"
        echo "Railsを http://localhost:${RAILS_PORT} で起動します"
        exec devbox run --env "PORT=$RAILS_PORT" server

  jobs:
    desc: Solid Queue workerを起動
    cmds:
      - devbox run jobs

  console:
    desc: Railsコンソールを起動
    cmds:
      - devbox run console

  console-sandbox:
    desc: サンドボックスモードのRailsコンソールを起動
    cmds:
      - devbox run console:sandbox

  bundle:
    desc: bundle installを実行
    cmds:
      - devbox run bundle

  dbinit:
    desc: DBをdropしてsetup
    cmds:
      - devbox run db:init

  dbconsole:
    desc: DBコンソールを起動
    cmds:
      - devbox run db:console

  migrate:
    desc: マイグレーションを実行
    cmds:
      - devbox run db:migrate

  migrate-redo:
    desc: 最後のマイグレーションをやり直し
    cmds:
      - devbox run db:migrate:redo

  rollback:
    desc: マイグレーションをロールバック
    cmds:
      - devbox run db:rollback

  dbseed:
    desc: db:seedを実行
    cmds:
      - devbox run db:seed

  db:backup:
    desc: 開発DBを圧縮形式で日付付きバックアップ
    cmds:
      - devbox run db:backup

  db:restore:
    desc: 開発DBをリストア
    cmds:
      - devbox run db:restore

  db-dump:
    desc: db:backupの互換エイリアス
    cmds:
      - task: db:backup

  db-restore:
    desc: db:restoreの互換エイリアス
    cmds:
      - task: db:restore

  update-originals-all:
    desc: 原作・原曲データをupsert
    cmds:
      - devbox run update:originals

  seed-originals:
    desc: 原作データをtruncateして再投入
    cmds:
      - devbox run seed:originals

  seed-original-songs:
    desc: 原曲データをtruncateして再投入
    cmds:
      - devbox run seed:original_songs

  seed-originals-all:
    desc: 原作・原曲データをtruncateして再投入
    cmds:
      - devbox run seed:originals:all

  minitest:
    desc: Minitestを実行
    cmds:
      - devbox run test

  js-test:
    desc: JavaScriptテストを実行
    cmds:
      - devbox run -- yarn test:js

  minitest-assets:
    desc: Minitest後にCSS/JSアセットをビルド
    cmds:
      - task minitest
      - devbox run test:assets

  rubocop:
    desc: RuboCopを実行
    cmds:
      - devbox run rubocop

  rubocop-correct:
    desc: RuboCopの安全な自動修正
    cmds:
      - devbox run rubocop:fix

  rubocop-correct-all:
    desc: RuboCopの全自動修正
    cmds:
      - devbox run rubocop:fix:all

  build:
    desc: JavaScriptアセットをビルド
    cmds:
      - devbox run -- yarn build

  build-css:
    desc: Tailwind CSSをビルド
    cmds:
      - devbox run -- yarn build:css

  playwright-cli:
    desc: Playwright CLIを起動
    cmds:
      - devbox run -- yarn playwright-cli

  export-for-algolia:
    desc: Algolia向けJSONを出力
    cmds:
      - devbox run export:algolia

  check-algolia:
    desc: Algoliaとの差分を確認
    cmds:
      - devbox run check:algolia

  export-karaoke-songs:
    desc: カラオケ楽曲をエクスポート
    cmds:
      - devbox run export:karaoke

  import-karaoke-songs:
    desc: カラオケ楽曲をインポート
    cmds:
      - devbox run import:karaoke

  export-display-artists:
    desc: 表示用アーティストをエクスポート
    cmds:
      - devbox run export:artists

  import-display-artists:
    desc: 表示用アーティストをインポート
    cmds:
      - devbox run import:artists

  import-touhou-music:
    desc: 東方楽曲データをインポート
    cmds:
      - devbox run import:touhou

  import-touhou-music-slim:
    desc: 東方楽曲データを軽量インポート
    cmds:
      - devbox run import:touhou:slim

  check-expired-joysound:
    desc: 配信期限切れのJOYSOUNDレコードを確認
    cmds:
      - devbox run check:joysound

  delete-expired-joysound:
    desc: 配信期限切れのJOYSOUNDレコードを削除
    cmds:
      - devbox run delete:joysound

  stats:
    desc: 統計情報を生成
    cmds:
      - devbox run stats

  data-duplicate-report:
    desc: unique indexを妨げる重複を報告
    cmds:
      - devbox run data:duplicates

  data-duplicate-impact-report:
    desc: データを変更せず重複行の影響を報告
    cmds:
      - devbox run -- bin/rails data_integrity:duplicate_impact_report
