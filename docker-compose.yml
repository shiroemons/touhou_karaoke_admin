services:
  postgres-18:
    image: postgres:18.4-alpine3.24
    volumes:
      - postgres-18:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U postgres -d postgres -c 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s

  web: &web
    build: .
    image: app:1.0.0
    stdin_open: true
    tty: true
    volumes:
      - .:/app:cached
      - bundle:/app/vendor/bundle
      - node_modules:/app/node_modules
      - rails_cache:/app/tmp/cache
    tmpfs:
      - /tmp:exec,mode=1777
    environment:
      BUNDLE_PATH: "/app/vendor/bundle"
      BOOTSNAP_CACHE_DIR: "/app/vendor/bundle"
      WD_INSTALL_DIR: "/usr/local/bin"
      HISTFILE: "/app/log/.bash_history"
      EDITOR: "vi"
      PGHOST: "postgres-18"
      PGPORT: "5432"
      PGUSER: "postgres"
      PGPASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      RAILS_MASTER_KEY:
    depends_on:
      postgres-18:
        condition: service_healthy
    command: bash -c "bundle install --jobs=4 && yarn install --immutable && rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    expose: ["3000"]
    ports: ["${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"]
    user: root
    working_dir: /app

volumes:
  postgres-18:
  bundle:
  node_modules:
  rails_cache:
